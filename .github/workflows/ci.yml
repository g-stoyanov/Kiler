# Build, format check and tests with coverage on every push to main and every pull request.
# The steps call the scripts in the repository root, so the same commands run locally and can
# move to another CI system (PLAN section 9). The YAML only sets up the machine around them.
# The actions are pinned to a commit, because a tag can be moved to other code.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        # Windows PowerShell 5.1, the same as on the developer machines.
        shell: powershell
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The SDK from global.json, with its rollForward.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The NuGet packages and the local dotnet tools (dotnet-tools.json).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'dotnet-tools.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Format check
        run: .\format.ps1

      - name: Build
        run: .\build.ps1

      - name: Test
        run: .\test.ps1 -NoBuild

      # AppendAllText writes UTF-8 without a BOM; >> in Windows PowerShell would write UTF-16.
      - name: Coverage summary
        run: |
          $summary = [IO.File]::ReadAllText("$PWD\TestResults\coverage-report\SummaryGithub.md")
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $summary)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: TestResults/coverage-report
          if-no-files-found: error
