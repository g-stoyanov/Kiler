# On every push to main and every pull request: the format check, the UI checks, the build, the tests with coverage, the
# publish of Kiler.exe and the smoke tests against it. The coverage report and Kiler.exe are the artifacts of the run.
# The steps call the scripts in the repository root, so the same commands run locally and can
# move to another CI system (PLAN section 9). The YAML only sets up the machine around them.
# The actions are pinned to a commit, because a tag can be moved to other code.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        # Windows PowerShell 5.1, the same as on the developer machines.
        shell: powershell
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The SDK from global.json, with its rollForward.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The NuGet packages and the local dotnet tools (dotnet-tools.json).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'dotnet-tools.json', '**/Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # check-ui.ps1 runs npm ci in src/ui. The Release build then finds node_modules in place and only runs npm run build,
      # and embeds the UI in Kiler.exe (Kiler.App.csproj); publish.ps1 runs a clean npm ci and UI build of its own.
      # The npm cache, not node_modules, is cached; npm ci fills node_modules from it.
      # check-latest: the Node 24 already on the runner may be older than the 24.15 that src/ui needs (engines).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Format check
        run: .\format.ps1

      # Prettier, ESLint, the type check and Vitest in src/ui.
      - name: UI checks
        run: .\check-ui.ps1

      - name: Build
        run: .\build.ps1

      # The smoke tests skip here; they run against the published exe below.
      - name: Test
        run: .\test.ps1 -NoBuild

      # AppendAllText writes UTF-8 without a BOM; >> in Windows PowerShell would write UTF-16.
      - name: Coverage summary
        run: |
          $summary = [IO.File]::ReadAllText("$PWD\TestResults\coverage-report\SummaryGithub.md")
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, $summary)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: TestResults/coverage-report
          if-no-files-found: error

      # Native AOT links with the Visual Studio C++ tools of the runner.
      - name: Publish
        run: .\publish.ps1

      - name: Smoke tests
        run: .\smoke.ps1 -NoBuild

      # No exe from a pull request run. A pull request runs its own ci.yml, so this condition does not stop a hostile one; it
      # keeps honest pull request runs from making exes that look the same. Take the exe from a push run on main, and check it
      # against the SHA-256 on the run page.
      # archive: false uploads the exe itself, not a zip; the artifact takes the file name, Kiler.exe.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          path: artifacts/publish/Kiler.exe
          archive: false
          if-no-files-found: error

      - name: Kiler.exe SHA-256
        if: github.event_name != 'pull_request'
        run: |
          $hash = (Get-FileHash -LiteralPath artifacts\publish\Kiler.exe -Algorithm SHA256).Hash
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "`n**Kiler.exe** SHA-256: ``$hash```n")
